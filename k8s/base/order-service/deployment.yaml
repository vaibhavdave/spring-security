apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: enterprise-security
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-service
      containers:
        - name: order-service
          image: enterprise-security/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: order_service
            - name: DB_USERNAME
              value: order_service
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: ORDER_SERVICE_DB_PASSWORD
            - name: KEYCLOAK_ISSUER_URI
              value: http://keycloak:8080/realms/enterprise
            - name: KEYCLOAK_TOKEN_URI
              value: http://keycloak:8080/realms/enterprise/protocol/openid-connect/token
            - name: ORDER_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: order-service-oauth2
                  key: ORDER_SERVICE_CLIENT_SECRET
            - name: USER_SERVICE_BASE_URL
              value: http://user-service:8081
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: enterprise-security
spec:
  selector:
    app: order-service
  ports:
    - port: 8082
      targetPort: 8082
