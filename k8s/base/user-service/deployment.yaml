apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: enterprise-security
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      # Distinct ServiceAccount per microservice is what Istio's AuthorizationPolicy keys off of
      # (spiffe://cluster.local/ns/enterprise-security/sa/user-service) to authorize which
      # workloads may call which routes at the mesh layer, independent of the JWT-level checks.
      serviceAccountName: user-service
      containers:
        - name: user-service
          image: enterprise-security/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: user_service
            - name: DB_USERNAME
              value: user_service
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: USER_SERVICE_DB_PASSWORD
            - name: KEYCLOAK_ISSUER_URI
              value: http://keycloak:8080/realms/enterprise
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: enterprise-security
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
