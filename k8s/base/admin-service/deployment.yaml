apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: enterprise-security
  labels:
    app: admin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      serviceAccountName: admin-service
      containers:
        - name: admin-service
          image: enterprise-security/admin-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: admin_service
            - name: DB_USERNAME
              value: admin_service
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: ADMIN_SERVICE_DB_PASSWORD
            - name: KEYCLOAK_ISSUER_URI
              value: http://keycloak:8080/realms/enterprise
            - name: PARTNER_ACME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-service-apikeys
                  key: PARTNER_ACME_API_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: enterprise-security
spec:
  selector:
    app: admin-service
  ports:
    - port: 8083
      targetPort: 8083
